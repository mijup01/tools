<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualisierungen</title>
  <script src="../theme.js"></script>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #fff;
      --border: #e4e6eb;
      --text: #1a1a2e;
      --text-secondary: #444;
      --muted: #999;
      --very-muted: #ccc;
      --input-bg: #f7f8fa;
      --progress-track: #f0f2f5;
      --shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    [data-theme="dark"] {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2d3a;
      --text: #e0e0e0;
      --text-secondary: #c8c8d0;
      --muted: #555;
      --very-muted: #3a3d4a;
      --input-bg: #0f1117;
      --progress-track: #0f1117;
      --shadow: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
      transition: background 0.2s, color 0.2s;
    }

    .container { max-width: 560px; margin: 0 auto; }

    header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .back-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
    .back-link:hover { color: var(--text); }
    h1 { font-size: 1.5rem; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .card-label {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1.1rem;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #4f7fff; }
    input[type="text"]::placeholder { color: var(--very-muted); }

    .input-row { display: flex; gap: 8px; align-items: stretch; }
    .clear-btn {
      flex-shrink: 0;
      width: 48px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .clear-btn:hover { border-color: #e53e3e; background: rgba(229,62,62,0.08); }

    .field-hint { font-size: 0.78rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .field-hint a { color: #4f7fff; text-decoration: none; }
    .field-hint a:hover { text-decoration: underline; }
    .error { color: #e53e3e; }

    .summary { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .summary-days { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .summary-unit { font-size: 1rem; color: var(--text-secondary); }
    .summary-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 20px; }

    .bars { display: flex; flex-wrap: wrap; gap: 14px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 48px; }
    .bar-track {
      width: 100%; height: 180px;
      background: var(--progress-track);
      border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
      display: flex; align-items: flex-end;
    }
    .bar-fill { width: 100%; border-radius: 8px 8px 0 0; background: linear-gradient(0deg, #059669, #34d399); }
    .bar-fill.partial { background: linear-gradient(0deg, #d97706, #fcd34d); }
    .bar-label { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .bar-value { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .empty-state { color: var(--very-muted); font-size: 0.9rem; text-align: center; padding: 8px 0; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <a class="back-link" href="../index.html">&#8592; Tools</a>
    <h1>Visualisierungen</h1>
  </header>

  <div class="card">
    <div class="card-label">Überzeit</div>
    <div class="input-row">
      <input type="text" id="overtime" autocomplete="off" placeholder="z.B. 11.12 oder 4 6 1">
      <button type="button" class="clear-btn" id="clear-btn" title="Eingabe löschen" aria-label="Eingabe löschen">&#128465;</button>
    </div>
    <div class="field-hint" id="field-hint"></div>
  </div>

  <div class="card">
    <div class="card-label">Überzeit in Tagen</div>
    <div id="result"><div class="empty-state">Überzeit eingeben, um die Tage zu sehen</div></div>
  </div>
</div>

<script>
  function readCookie(name, fallback) {
    const found = document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith(name + '='));
    return found ? decodeURIComponent(found.slice(name.length + 1)) : fallback;
  }

  const TAGESSTUNDEN = parseFloat(readCookie('standardstunden', '8.3')) || 8.3;
  const MAX_STUNDEN = 5000;

  document.getElementById('field-hint').innerHTML =
    `Tägliche Arbeitszeit: <strong>${TAGESSTUNDEN}h</strong> (aus den <a href="../einstellungen/einstellungen.html">Einstellungen</a>). Eingabe im Format 11.12 (Punkt als Trenner). Mehrere Werte mit Leerzeichen werden zusammengerechnet, z.B. 4 6 1.`;

  // "11.12" oder "4 6 1" (Werte mit Leerzeichen) -> { summe, teile }; null = ungültig
  function parseStunden(text) {
    const teile = text.trim().split(/\s+/);
    let summe = 0;
    for (const t of teile) {
      if (!/^\d+(\.\d+)?$/.test(t)) return null;
      summe += Number(t);
    }
    return { summe, teile };
  }

  const fmt = n => String(+n.toFixed(2));

  function render() {
    const input = document.getElementById('overtime');
    const hint = document.getElementById('field-hint');
    const result = document.getElementById('result');
    const text = input.value;

    hint.classList.remove('error');
    if (!text.trim()) {
      result.innerHTML = '<div class="empty-state">Überzeit eingeben, um die Tage zu sehen</div>';
      return;
    }

    const eingabe = parseStunden(text);
    if (eingabe === null || eingabe.summe > MAX_STUNDEN) {
      hint.classList.add('error');
      result.innerHTML = '<div class="empty-state">Bitte Stunden im Format 11.12 eingeben (mehrere Werte mit Leerzeichen)</div>';
      return;
    }
    const stunden = eingabe.summe;
    const summand = eingabe.teile.length > 1 ? `${eingabe.teile.join(' + ')} = ` : '';

    const tage = stunden / TAGESSTUNDEN;
    const volle = Math.floor(tage + 1e-9);
    const rest = tage - volle;
    const hatRest = rest > 1e-6;

    let html = `<div class="summary"><span class="summary-days">${fmt(tage)}</span><span class="summary-unit">Tage</span></div>` +
               `<div class="summary-sub">${summand}${fmt(stunden)}h Überzeit ÷ ${TAGESSTUNDEN}h pro Tag</div><div class="bars">`;

    for (let i = 1; i <= volle; i++) {
      html += `<div class="bar-col"><span class="bar-value">${fmt(TAGESSTUNDEN)}h</span>` +
              `<div class="bar-track"><div class="bar-fill" style="height:100%"></div></div>` +
              `<span class="bar-label">Tag ${i}</span></div>`;
    }
    if (hatRest) {
      html += `<div class="bar-col"><span class="bar-value">${fmt(rest * TAGESSTUNDEN)}h</span>` +
              `<div class="bar-track"><div class="bar-fill partial" style="height:${(rest * 100).toFixed(1)}%"></div></div>` +
              `<span class="bar-label">Tag ${volle + 1}</span></div>`;
    }
    if (!volle && !hatRest) {
      html += '<div class="empty-state">Keine Überzeit</div>';
    }
    result.innerHTML = html + '</div>';
  }

  // Nur Ziffern, Punkt und Leerzeichen sind erlaubt. Eine Eingabe/Einfügung mit anderen
  // Zeichen (z.B. "12:30" oder "12,5") wird komplett abgelehnt statt still verändert.
  const COOKIE_NAME = 'visualisierung_ueberzeit';
  const overtimeInput = document.getElementById('overtime');
  let letzterGueltigerWert = '';

  function saveInput(value) {
    document.cookie = value
      ? `${COOKIE_NAME}=${encodeURIComponent(value)};path=/;max-age=${60 * 60 * 24 * 365}`
      : `${COOKIE_NAME}=;path=/;max-age=0`;
  }

  overtimeInput.addEventListener('input', e => {
    if (/[^\d. ]/.test(e.target.value)) {
      e.target.value = letzterGueltigerWert;
    } else {
      letzterGueltigerWert = e.target.value;
    }
    saveInput(letzterGueltigerWert);
    render();
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    overtimeInput.value = '';
    letzterGueltigerWert = '';
    saveInput('');
    render();
    overtimeInput.focus();
  });

  const gespeichert = readCookie(COOKIE_NAME, '');
  if (/^[\d. ]+$/.test(gespeichert)) {
    overtimeInput.value = gespeichert;
    letzterGueltigerWert = gespeichert;
    render();
  }
</script>
</body>
</html>
